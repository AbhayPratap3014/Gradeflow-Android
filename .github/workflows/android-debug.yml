name: Build Gradeflow Android APK

on:
  push:
    branches: [app-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew assembleDebug --stacktrace --no-daemon --max-workers=2 \
              -Dorg.gradle.internal.http.connectionTimeout=120000 \
              -Dorg.gradle.internal.http.socketTimeout=120000; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle/Maven download failed; waiting before retry..."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gradeflow-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
